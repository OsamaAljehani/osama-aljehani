<header class="site-header{{ if .IsHome }} is-home{{ end }}">
  <a class="wordmark" href="{{ "/" | relURL }}">
    <span class="wm-ar">{{ .Site.Title }}</span>
    <span class="wm-en" dir="ltr">{{ .Site.Params.nameLatin | default "OSAMA ALJEHANI" }}</span>
  </a>
  <nav class="site-nav" aria-label="القائمة الرئيسية">
    {{ partial "min/menu" . }}
  </nav>
</header>
