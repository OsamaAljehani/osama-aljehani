<header class="site-header">
  <div>
    {{ if .IsHome }}<h1 class="home-title">{{ end }}
    <a class="wordmark" href="{{ "/" | relURL }}">
      <span class="wm-ar">{{ .Site.Title }}</span>
      <span class="wm-en" dir="ltr" lang="en">{{ .Site.Params.nameLatin | default "OSAMA ALJEHANI" }}</span>
    </a>
    {{ if .IsHome }}</h1><div class="home-bio">{{ .Content }}</div>{{ end }}
  </div>
  <nav class="site-nav" aria-label="القائمة الرئيسية">
    {{ partial "min/menu" . }}
  </nav>
</header>
