{{ define "main" }}
<article class="article">
  <header class="article-head">
    <h1>{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="subtitle">{{ . }}</p>{{ end }}
    <p class="byline">{{ .Site.Title }} · {{ partial "min/date" . }}</p>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  <footer class="article-foot">
    <p>شارك:
      <a href="https://x.com/intent/post?url={{ .Permalink }}&amp;text={{ .Title }}" target="_blank" rel="noopener">X</a> ·
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}" target="_blank" rel="noopener">LinkedIn</a> ·
      <a href="https://wa.me/?text={{ .Title }}%20{{ .Permalink }}" target="_blank" rel="noopener">واتساب</a>
    </p>
    <p><a href="{{ "posts/" | relURL }}">← كل المنشورات</a></p>
  </footer>
</article>
{{ end }}
