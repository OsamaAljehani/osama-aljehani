{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
</header>
{{- if .Pages }}
<ol class="title-list">
  {{- range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ partial "min/date" . }}
  </li>
  {{- end }}
</ol>
{{- else }}
<p class="empty">لا توجد منشورات بعد.</p>
{{- end }}
{{ end }}
