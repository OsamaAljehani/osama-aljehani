{{ define "main" }}
<article class="article about">
  <header class="article-head">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="about-body">
    {{ with resources.Get .Site.Params.avatar }}{{ $p := .Fill "320x320" }}
    <img class="portrait" src="{{ $p.RelPermalink }}" alt="{{ $.Site.Title }}" width="140" height="140">
    {{ end }}
    <div class="prose">{{ .Content }}</div>
  </div>
</article>
{{ end }}
