      - title: واشنطن تُبعد دبلوماسيًا كوبيًا عقب مشادة في الأمم المتحدة
        summary: أبعدت الولايات المتحدة الدبلوماسي الكوبي ريتشارد تور دي لا كونسيبسيون، عقب مشادة في الأمم المتحدة بين السفير الأمريكي مايك والتز ووزير الخارجية الكوبي برونو رودريغيز خلال مناقشة الحظر الاقتصادي على كوبا. واتُّهم الدبلوماسي بضرب هاتف عضو بالوفد الأمريكي أثناء تصويره، فيما اتهمت هافانا الجانب الأمريكي بمضايقته، وسط تدهور العلاقات بين البلدين.
