01.jpg: "ملعب خلف سياج شبكي تحيط به الأشجار."
02.jpg: "ضوء الشمس يتسلل بين أغصان شجرة كثيفة."
03.jpg: "واجهة منزل خلف سور قصير وفي ظل أشجار كبيرة."
04.jpg: "واجهات محال على الجانب المقابل من الشارع."
05.jpg: "منزل أزرق فاتح على ناصية شارع تتقاطع فوقه الأسلاك."
06.jpg: "إطار نافذة خشبي ينعكس في زجاجه الشجر المقابل."
07.jpg: "علم أمريكي يتدلى من واجهة مبنى بين عمارات شاهقة."
08.jpg: "حاجز مخطّط بالأحمر والأبيض عند مدخل طريق بين الأشجار."
09.jpg: "طريق بخطّين أصفرين يمتد بين صفّين من الأشجار، كما يبدو من سيارة."
10.jpg: "جدول ماء يمر بين الصخور والأشجار الخضراء."
11.jpg: "مياه بيضاء تتخلل صخورًا بنية تحت سماء مائلة إلى البنفسجي."
12.jpg: "ضوء دافئ يتسلل بين جذوع الأشجار في الغابة."
13.jpg: "أغصان عارية تتشعب أمام سماء زرقاء صافية."
14.jpg: "زهور صفراء تطل من وراء ألواح سياج خشبي."
15.jpg: "شارع بين مبانٍ غارقة في الظل، وفي آخره برج مضاء."
16.jpg: "لقطة عمودية لبرج فاتح اللون بين واجهات مظللة."
17.jpg: "مبانٍ شاهقة تظهر خلف واجهة سفلية تكسوها الظلال."
18.jpg: "ضوء ساطع على أحد جانبي شارع تصطف فيه عمارات متعددة الطوابق."
19.jpg: "صف من جذوع الأشجار تتخلله بقع من الضوء."
20.jpg: "ممر ترابي ينحني بين الأشجار الكثيفة."
21.jpg: "فتحة بين الأشجار تطل على أعشاب طويلة وسماء فاتحة."
22.jpg: "أغصان داكنة تؤطر فسحة من الأعشاب."
23.jpg: "قطار يمر فوق نفق تحيط به الأشجار."
24.jpg: "جذع شجرة فاتح يبرز أمام الغابة الداكنة."
25.jpg: "مبنى أبيض صغير على ضفة الماء، يظهر انعكاسه أسفل الصورة."
26.jpg: "مبنى خشبي بنوافذ مغلقة وباب داكن عند زاويته."
27.jpg: "درج قصير بدرابزين معدني يقود إلى باب أبيض في جدار من الطوب."
28.jpg: "مبنى خشبي أبيض يمتد أمامه سياج أحمر، وخلفه أشجار كثيفة."
29.jpg: "منزل صغير بواجهة فاتحة بين منزلين، أمامه رصيف فارغ."
30.jpg: "يد تحمل غصنًا أخضر أمام خلفية من النباتات."
