name: "Osama M. G. Aljehani"
role: "International Correspondent"
location: "Washington, D.C."
profile: "Saudi journalist covering U.S. foreign policy, Saudi–U.S. relations and multilateral diplomacy from Washington. Previously led the Saudi Press Agency’s London bureau after beginning his career on its international news desk in Riyadh. His reporting spans a decade and draws on training in international relations and law."

experience:
  - role: "International Correspondent"
    org: "Saudi Press Agency"
    place: "Washington, D.C."
    period: "Mar 2025 – Present"
    bullets:
      - "Cover U.S. foreign policy, bilateral diplomacy and international economic affairs for Arabic-language audiences."
      - "Report from UN proceedings, the IMF and World Bank meetings, and Saudi–U.S. business forums. Produce written and filmed interviews with diplomats, economists and cultural leaders."
  - role: "International Correspondent and London Bureau Lead"
    org: "Saudi Press Agency"
    place: "London, United Kingdom"
    period: "Jan 2021 – Feb 2025"
    bullets:
      - "Directed daily coverage and coordinated assignments for the London bureau."
      - "Reported on ministerial visits, Saudi–U.K. relations and European affairs, including COP26 in Glasgow and UNESCO–Mawhiba engagement in Paris."
  - role: "International News Editor"
    org: "Saudi Press Agency · Foreign Bulletins Department"
    place: "Riyadh, Saudi Arabia"
    period: "Mar 2016 – Jan 2021"
    bullets:
      - "Edited and translated international wire copy, verified official sources and prepared foreign-affairs coverage on deadline."
      - "Covered the Saudi–U.S. CEO Forum, the Future Investment Initiative and the Financial Sector Conference."

sections:
  - title: "Selected coverage"
    items:
      - date: "2026"
        title: "UN General Assembly, New York"
        detail: "Covered the 81st session and interviewed the Secretary-General’s spokesperson on Middle East diplomacy."
      - date: "2025–26"
        title: "International economic institutions"
        detail: "Reported on the IMF and World Bank meetings in Washington, with a focus on investment, development and the global economic outlook."
      - date: "2025"
        title: "Saudi–U.S. diplomacy and investment"
        detail: "Covered the Crown Prince’s Washington visit and the U.S.–Saudi Investment Forum."
  - title: "Selected interviews"
