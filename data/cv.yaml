        detail: "U.S. Chamber of Commerce. Discussed bilateral trade and the role of the private sector in Saudi Vision 2030."
      - title: "Chase F. Robinson"
        detail: "Director, Smithsonian’s National Museum of Asian Art. Discussed the museum’s collaboration with AlUla."
      - title: "Jerry Inzerillo"
        detail: "Group CEO, Diriyah Company. Discussed Saudi investment and development during the Crown Prince’s Washington visit."
